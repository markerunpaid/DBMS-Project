spring.application.name=quick-commerce
server.port=8080

# MySQL -- run ../schema.sql and ../seed.sql first; set DB_USER / DB_PASSWORD in the environment
spring.datasource.url=jdbc:mysql://localhost:3306/quick_commerce
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# schema.sql is the source of truth -- Hibernate never creates or alters tables
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT (override JWT_SECRET outside development; must be base64 of >= 32 bytes)
app.jwt.secret=${JWT_SECRET:cXVpY2stY29tbWVyY2UtZGV2LXNlY3JldC1rZXktY2hhbmdlLW1lLTEyMzQ1Njc4OTA=}
app.jwt.expiration-minutes=720
app.cors.allowed-origin=http://localhost:5173
